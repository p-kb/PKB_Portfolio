<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>자유게시판</title>
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      h1 {
        width: 100%;
        height: 300px;
        background: url(https://cdn.pixabay.com/photo/2016/03/27/23/11/post-it-notes-1284667_640.jpg)
          left top / cover;
        text-align: center;
        line-height: 300px;
        color: #fff;
      }
      .con {
        max-width: 1200px;
        margin: 50px auto;
      }
    </style>
  </head>
  <body>
    <h1>자유게시판</h1>
    <div class="con">
      <iframe
        src="https://ghol7416open.dothome.co.kr/gnuboard5/bbs/board.php?bo_table=free"
        id="iframe"
        style="width: 100%"
        onload="Height();"
        frameborder="0"
        scrolling="no"
      ></iframe>
    </div>

    <script>
      function Height() {
        let the_height =
          document.getElementById("iframe").contentWindow.document.body
            .scrollHeight;
        document.getElementById("iframe").height = the_height + 50;
        document.getElementById("iframe").style.overflow = "hidden";
      }
    </script>
  </body>
</html>
